[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bot-coms-messaging"
version = "0.1.0"
description = "Persistent Conduit DMs and groups over bot-coms"
requires-python = ">=3.11"
dependencies = ["bot-coms>=0.1.0", "fastapi>=0.115", "PyYAML>=6"]

[project.scripts]
bot-coms-messaging-worker = "bot_coms_messaging.worker:main"

[tool.setuptools.packages.find]
where = ["src"]
